<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#111;--fg:#eee;--panel:#222;--accent:#3b82f6;--bad:#dc2626;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid #444;border-radius:8px;padding:10px 14px}
button{cursor:pointer}
button.off{background:var(--bad);border-color:var(--bad)}
.primary{background:var(--accent);border-color:var(--accent)}
#lobby{margin:auto;display:flex;flex-direction:column;gap:12px;width:min(320px,100% - 32px)}
#lobby h1{margin:0 0 8px;font-weight:500}
#call{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}
#stage{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:8px;padding:8px;overflow:auto;align-content:center}
.tile{position:relative;background:var(--panel);border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.novid video{visibility:hidden}
.tile span{position:absolute;left:8px;bottom:8px;background:#0008;padding:2px 8px;border-radius:6px;font-size:14px}
.tile.novid span{left:50%;bottom:50%;transform:translate(-50%,50%);font-size:20px;background:none}
.tile i{position:absolute;right:8px;top:8px;background:#0008;padding:2px 8px;border-radius:6px;font:12px system-ui,sans-serif}
.tile i:empty{display:none}
#chat{width:min(320px,100%);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid #333}
#log{flex:1;overflow:auto;padding:8px;font-size:14px;overflow-wrap:anywhere}
#log b{color:var(--accent)}
#say{display:flex;gap:4px;padding:8px}
#say input{flex:1;min-width:0}
nav{display:flex;gap:8px;justify-content:center;padding:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:8px}
@media (max-width:640px){#chat{position:fixed;inset:0 0 64px 0;width:auto;border:0}}
</style>
</head>
<body>
<form id="lobby">
  <h1>Call</h1>
  <input id="code" inputmode="numeric" autocomplete="off" placeholder="Code (6–12 digits)" aria-label="Call code">
  <input id="name" maxlength="30" placeholder="Your name" aria-label="Your name">
  <label><input type="checkbox" id="voice"> Voice only</label>
  <button class="primary">Join</button>
  <button type="button" id="new">New call</button>
</form>
<main id="call" hidden>
  <div id="stage">
    <div id="grid"></div>
    <aside id="chat" hidden>
      <div id="log" aria-live="polite"></div>
      <form id="say"><input id="msg" autocomplete="off" maxlength="2000" aria-label="Message"><button>Send</button></form>
    </aside>
  </div>
  <nav>
    <button id="mic">Mic</button>
    <button id="cam">Cam</button>
    <button id="chatBtn">Chat</button>
    <button id="share">Share</button>
    <button id="leave" class="off">Leave</button>
  </nav>
</main>
<div id="toast" hidden></div>
<script>
const $ = id => document.getElementById(id)
const hex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('')
// four STUN ports: a NAT that maps them to different ports picks a new port per destination ("hard" NAT),
// and the ports it picks hint at its step and range
const ICE = [{urls: [0, 1, 2, 3].map(k => `stun:${location.hostname}:${+'{{STUN_PORT}}' + k}`)}]
const CFG = {iceServers: ICE, bundlePolicy: 'max-bundle'} // one socket per network, so a second port means a hard NAT
const BIG = 6 // above this many people, only people who are talking send video
const me = {id: hex(8), token: hex(16)}
const peers = {} // id -> {id, pc, d, v, s, i, name, ok, relay, chain, ls, rs, bs, bc}
const chats = [], seen = new Set() // recent chat, replayed to late joiners; ids dedupe replays from several peers
let room, local, ac, mine, micOn = true, camOn = false, sentVideo = null, talking = false

const toast = (t, ms = 2500) => { $('toast').textContent = t; $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').hidden = true, ms) }
try { $('name').value = localStorage.name || '' } catch {}

const fromUrl = location.pathname.slice(1)
if (/^\d{6,12}$/.test(fromUrl)) { $('code').value = fromUrl; $('code').hidden = $('new').hidden = true }
onpopstate = () => location.reload()
// opening any page with ?diag makes this device report each call's connection attempts to the server log
// (journalctl -u hi | grep diag) until it opens one with ?diag=0
const DIAG = (() => { try { const q = new URLSearchParams(location.search).get('diag'); if (q != null) localStorage.diag = q == '0' ? '' : 1; return !!localStorage.diag } catch { return false } })()

// 10 digits so generated rooms can't be found by scanning; typed codes can still be as short as 6
$('new').onclick = () => { $('code').value = String(10n ** 9n + crypto.getRandomValues(new BigUint64Array(1))[0] % (9n * 10n ** 9n)); $('lobby').requestSubmit() }

$('lobby').onsubmit = async e => {
  e.preventDefault()
  if ($('lobby').inert) return // already joining or joined
  room = $('code').value.trim()
  if (!/^\d{6,12}$/.test(room)) return toast('Code must be 6–12 digits')
  try { localStorage.name = $('name').value } catch {}
  $('lobby').inert = true
  ac = new AudioContext() // created inside the click so it isn't suspended
  try { local = await navigator.mediaDevices.getUserMedia({audio: true, video: !$('voice').checked}) }
  catch { try { local = await navigator.mediaDevices.getUserMedia({audio: true}) } catch { $('lobby').inert = false; return toast('Microphone access is needed') } }
  camOn = local.getVideoTracks().length > 0
  history.pushState(0, '', '/' + room)
  $('lobby').hidden = true; $('call').hidden = false
  $('cam').classList.toggle('off', !camOn)
  mine = tile(me.id, 'You', local, true)
  mine.d.classList.toggle('novid', !camOn)
  const es = new EventSource(`/api/${room}/events?id=${me.id}&token=${me.token}`)
  es.onmessage = e => {
    const m = JSON.parse(e.data)
    // newcomer always offers, so there's never offer glare; on SSE reconnect skip peers we already have
    if (m.t == 'hello') m.peers.forEach(id => peers[id] || connect(id, true))
    if (m.t == 'signal') onSignal(m.from, m.data)
    if (m.t == 'leave' && peers[m.id] && !peers[m.id].ok) drop(m.id) // P2P peers detect leaving themselves
  }
  es.onerror = () => es.readyState == EventSource.CLOSED && toast('Lost the server, reload to let new people join', 1e9)
  watchVoice()
}

let sendQ = Promise.resolve() // keep signaling in order: an ICE candidate must never overtake its SDP
const sig = (to, data) => sendQ = sendQ.then(async () => {
  const body = JSON.stringify({token: me.token, to, data})
  for (let i = 0; i < 5; i++) { // retries cover our own event stream reconnecting (403)
    const r = await fetch('/api/signal', {method: 'POST', body}).catch(() => null)
    if (r?.ok) return
    if (r?.status == 404) return peers[to]?.ok || drop(to) // they've left the server
    await new Promise(f => setTimeout(f, 1000))
  }
})

function tile(id, label, stream, mine) {
  const d = document.createElement('div'), v = document.createElement('video'), s = document.createElement('span'), i = document.createElement('i')
  d.className = 'tile'; v.autoplay = v.playsInline = true; v.muted = !!mine; v.srcObject = stream; s.textContent = label
  d.append(v, s, i); $('grid').append(d)
  return {d, v, s, i}
}

function connect(id, offer) {
  const p = peers[id] = {id, name: '…', chain: Promise.resolve(), ls: [], rs: [], bs: [], bc: [], ...tile(id, '…', null)}
  const pc = p.pc = mkpc(p)
  p.v.srcObject = pc.ms
  p.d.classList.add('novid')
  pc.onicecandidate = e => { if (e.candidate) { sig(id, {c: e.candidate}); srflx(e.candidate) && p.ls.push(srflx(e.candidate)) } }
  if (offer) {
    av(pc)
    pc.setLocalDescription().then(() => sig(id, {sdp: pc.localDescription}))
  }
  status(p, 'connecting')
  stages(p)
  update()
  return p
}

// One connection attempt to peer p. Several can race (see burst); the first to connect is adopted.
// The TURN bridge (extra.iceTransportPolicy) carries the call until a direct attempt connects.
function mkpc(p, extra) {
  const pc = new RTCPeerConnection({...CFG, ...extra})
  const won = () => pc.turn ? live(p, pc) : adopt(p, pc)
  pc.turn = !!extra?.iceTransportPolicy
  pc.ms = new MediaStream()
  pc.dc = pc.createDataChannel('c', {negotiated: true, id: 0})
  pc.dc.onopen = () => { won(); (p.pc == pc || p.tr == pc && !p.ok) && (toPeer(p, {t: 'v', on: !!sentVideo}), greet(p)) }
  pc.dc.onmessage = e => { try { onData(p, JSON.parse(e.data)) } catch {} }
  pc.dc.onclose = () => p.pc == pc && p.ok && !p.relay && drop(p.id) // Firefox closes it when ICE fails, before any connection
  pc.ontrack = e => pc.ms.addTrack(e.track)
  pc.onconnectionstatechange = () => {
    if (pc.connectionState == 'connected') won()
    if (pc.connectionState != 'failed' || peers[p.id] != p) return
    if (p.tr == pc) { // the bridge broke (server restart, network blip): rebuild it, chat via signaling meanwhile
      p.tr = p.live = null; status(p, 'reconnecting')
      setTimeout(() => { offerBridge(p); setTimeout(() => relay(p), 10000) }, 1000)
      return
    }
    if (p.pc != pc) return
    if (!p.ok) return hard(p) || relay(p) // with a hard NAT the stage timers take it from here
    // worked before, so the network changed: start over. The lower id offers, so only one side does.
    drop(p.id)
    if (me.id < p.id) connect(p.id, true)
  }
  return pc
}

function adopt(p, pc) {
  if (p.ok) return p.pc == pc || pc.close() // another attempt won
  p.ok = true
  ;[p.pc, ...p.bs, p.tr].forEach(o => o && o != pc && o.close())
  p.pc = pc; p.bs = []; p.tr = p.live = p.relay = null; p.v.srcObject = pc.ms
  setTracks(pc); status(p, '')
  DIAG && report(p)
}

function av(pc) {
  pc.addTransceiver('audio', {direction: 'sendrecv'})
  pc.addTransceiver('video', {direction: 'sendrecv'})
  setTracks(pc)
}

function setTracks(pc) {
  const [a, v] = pc.getTransceivers()
  a.sender.replaceTrack(local.getAudioTracks()[0] || null)
  v.sender.replaceTrack(sentVideo)
}

// no direct path and no TURN bridge: keep the peer for chat, relayed through the server's signal channel
function relay(p) {
  if (p.relay || p.ok || p.live) return
  p.relay = true; p.pc.close()
  status(p); greet(p)
}

// TURN bridge, offered by the lower id once a plain connection hasn't happened within a few seconds.
// Relay-only on both sides, video capped, so the server carries little; hole punching keeps going behind it.
async function bridge(p) {
  if (p.tr || p.ok || peers[p.id] != p) return p.tr
  const r = await fetch('/api/turn', {method: 'POST', body: JSON.stringify({token: me.token})}).catch(() => null)
  if (!r?.ok || p.tr || p.ok || peers[p.id] != p) return p.tr
  const pc = p.tr = mkpc(p, {iceServers: [await r.json()], iceTransportPolicy: 'relay'})
  pc.onicecandidate = e => e.candidate && sig(p.id, {c: e.candidate, r: 1})
  return pc
}

const offerBridge = p => me.id < p.id && (p.chain = p.chain.then(async () => {
  const pc = await bridge(p)
  if (!pc || p.ok) return
  av(pc)
  await pc.setLocalDescription()
  sig(p.id, {sdp: pc.localDescription, r: 1})
}).catch(console.warn))

async function onTurn(p, d) {
  if (d.sdp?.type == 'offer' && p.tr?.remoteDescription) p.tr.close(), p.tr = p.live = null // they lost the old one first
  const pc = d.sdp?.type == 'offer' ? await bridge(p) : p.tr
  if (!pc || p.ok) return
  if (d.c) return pc.addIceCandidate(d.c)
  await pc.setRemoteDescription(d.sdp)
  if (d.sdp.type != 'offer') return
  pc.getTransceivers().forEach(t => t.direction = 'sendrecv')
  setTracks(pc)
  await pc.setLocalDescription()
  sig(p.id, {sdp: pc.localDescription, r: 1})
}

function live(p, pc) {
  if (p.ok || p.live || p.tr != pc) return
  p.live = true; p.v.srcObject = pc.ms
  const s = pc.getTransceivers()[1].sender, q = s.getParameters()
  if (q.encodings?.[0]) { q.encodings[0].maxBitrate = 3e5; s.setParameters(q).catch(() => {}) }
  status(p)
}

// Hole punching, escalating. Plain ICE fails when one side's NAT picks a new port per destination
// (common on mobile CGNAT) and the other only lets in replies from addresses it has sent to: neither
// knows where to send. The side with the easy NAT does the guessing; once it hits the hard side's
// port, both NATs let the traffic through.
const srflx = c => { const f = c.candidate?.split(' ') || []; return f[7] == 'srflx' && f[2].toLowerCase() == 'udp' && f[4].includes('.') && f }
// one local socket (raddr rport), several public ports. Per socket, because a computer with two network
// interfaces behind one easy NAT shows two ports too. If the browser hides raddr, all its sockets count as one.
const sym = l => { const k = f => f[4] + ' ' + f[9] + ' ' + f[11]; return new Set(l.map(f => k(f) + ' ' + f[5])).size > new Set(l.map(k)).size }
const hard = p => sym(p.ls) != sym(p.rs) // exactly one side is hard; both hard is hopeless without TURN
const easy = p => hard(p) && !sym(p.ls)

// Runs until a direct connection is found or the peer leaves; the TURN bridge or chat covers the wait.
function stages(p) {
  const at = (ms, f) => setTimeout(() => peers[p.id] == p && !p.ok && f(), ms)
  at(4000, () => {
    offerBridge(p)
    hard(p) && (status(p, 'guessing ports'), easy(p) && guess(p))
  })
  at(6000, function round() { // a fresh birthday round each time the last one has sent all its probes
    if (!hard(p)) return
    status(p, 'trying many ports'); easy(p) && burst(p).catch(console.warn)
    at(M * GAP + 6000, round)
  })
  at(40000, () => hard(p) || relay(p)) // a lost offer/answer never reaches 'failed'
  at(60000, () => relay(p))
  p.t0 = Date.now(); const tick = () => peers[p.id] == p && !p.ok && (report(p), setTimeout(tick, 10000))
  DIAG && setTimeout(tick, 5000)
}

// ?diag: every 10s until direct, what this side's attempts did. prflx = an address whose checks got in to us (a hit).
async function report(p) {
  const n = {}, add = (k, v = 1) => n[k] = (n[k] || 0) + v, ours = new Set(), prflx = new Set()
  const pcs = [p.pc, ...p.bs].filter(pc => pc.signalingState != 'closed')
  // in parallel, each with a timeout: Firefox's getStats can hang forever on a connection closed meanwhile
  const stats = await Promise.all(pcs.map(pc => Promise.race([pc.getStats().catch(() => new Map()), new Promise(r => setTimeout(r, 2000, new Map()))])))
  for (const [i, pc] of pcs.entries()) {
    add('conn_' + pc.connectionState)
    for (const s of stats[i].values()) {
      if (s.type == 'candidate-pair') add('pair_' + s.state), add('sent', s.requestsSent || 0), add('answered', s.responsesReceived || 0), add('got', s.requestsReceived || 0)
      if (s.type == 'local-candidate' && s.candidateType == 'srflx') ours.add(s.port)
      if (s.type == 'remote-candidate' && s.candidateType == 'prflx') prflx.add((s.address || s.ipAddress) + ':' + s.port)
    }
  }
  const d = {t: Math.round((Date.now() - p.t0) / 1000), peer: p.id, ua: navigator.userAgent, net: navigator.connection?.type, role: easy(p) ? 'easy' : hard(p) ? 'hard' : sym(p.ls) ? 'both hard' : 'neither hard',
    ok: p.ok, live: p.live, relay: p.relay, tr: p.tr?.connectionState, round: p.round, pcs: pcs.length, n, prflx: [...prflx].slice(0, 50),
    mine: p.ls.map(f => f[4] + ':' + f[5] + '<' + f[9] + ':' + f[11]), theirs: p.rs.map(f => f[4] + ':' + f[5] + '<' + f[9] + ':' + f[11]), srflxPorts: [...ours].sort((a, b) => a - b).slice(0, 300)}
  fetch('/api/diag', {method: 'POST', body: JSON.stringify({token: me.token, d})}).catch(() => {})
}

const status = (p, t) => p.i.textContent = p.ok ? '' : p.live ? 'via server' : p.relay ? 'chat only, via server' : t + '…'

// add made-up remote candidates: the peer's NAT IP at ports we hope it will use. Trickled at about
// Chrome's check rate: Firefox checks a batch fast, declares ICE failed and stops, but new candidates restart it.
function spray(pc, ip, ports) {
  ports.forEach((port, k) => port > 0 && port < 65536 && setTimeout(() => pc.signalingState != 'closed' &&
    pc.addIceCandidate({candidate: `candidate:g${k} 1 udp ${1e6 - k} ${ip} ${port} typ srflx raddr 0.0.0.0 rport 0`, sdpMid: '0'}).catch(() => {}), k * GAP))
}

// Stage 2: NATs that hand out ports in order (often per subscriber) put our mapping just above
// the ones the STUN servers saw, at the same step.
// ponytail: only guesses upwards, 256 ports; widen if real NATs land further away
function guess(p) {
  const ports = p.rs.map(f => +f[5]).sort((a, b) => a - b), top = ports.at(-1)
  const step = Math.min(Math.max(ports[1] - ports[0], 1), 32) // smallest gap: other users' traffic only widens gaps
  spray(p.pc, p.rs.at(-1)[4], Array.from({length: 256}, (_, k) => top + (k + 1) * step))
}

// Stage 3, birthday punch: the hard side opens K connections, each making a NAT mapping toward each of our
// H sockets, and each socket probes M random ports on its IP: P(hit) ≈ 1-e^(-H*K*M/range). Half the probes
// go near the ports the STUN servers saw (CGNATs often give each subscriber a block of ports), half
// anywhere. Each side's attempts share ICE credentials and a DTLS certificate, so any pair that meets can finish the handshake.
// Measured on Salt 5G: the K mappings toward one of our sockets come out as a near-contiguous run on a
// per-destination counter that sits anywhere in 1024-65535, so each probe hits with P ≈ K/64512 and the
// STUN-seen ports say nothing about where. Hits ≈ our probes * K/64512 per ~54s round; rounds repeat until one hits.
// So hits grow with live mappings and our probe rate, nothing else. Chrome checks ~16/s per connection; Firefox
// caps STUN at ~78/s per page, so a Firefox easy side uses one fast-probing connection. A Chrome hard side keeps
// K connections all round; a Firefox one keeps a rolling pool (see onBurst). Only one socket per connection can
// carry the call (the data channel's), so mappings mean connections. They cost the hard side's carrier NAT;
// Salt took ~1000 fine. Simulated, every browser pair connects directly in ~7-30s.
// ponytail: K=256 connections on the hard side, a phone; lower it if phones choke.
const FF = /Firefox/.test(navigator.userAgent), K = 256, H = FF ? 1 : 4, GAP = FF ? 13 : 60, M = Math.round(48000 / GAP)

async function shared() {
  const cert = await RTCPeerConnection.generateCertificate({name: 'ECDSA', namedCurve: 'P-256'}), u = hex(8), w = hex(16)
  return {cert, munge: d => ({type: d.type, sdp: d.sdp.replace(/a=ice-ufrag:.*/g, 'a=ice-ufrag:' + u).replace(/a=ice-pwd:.*/g, 'a=ice-pwd:' + w)})}
}

async function burst(p) { // easy side: offer. Each round has a number, so stale replies are ignored.
  const {cert, munge} = await shared(), b = p.round = (p.round || 0) + 1
  p.bs.forEach(o => o.close())
  p.bs = Array.from({length: H}, () => mkpc(p, {certificates: [cert]}))
  for (const pc of p.bs) {
    av(pc)
    pc.onicecandidate = e => e.candidate && sig(p.id, {c: e.candidate, b})
    await pc.setLocalDescription(munge(await pc.createOffer()))
  }
  sig(p.id, {sdp: p.bs[0].localDescription, b})
}

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a))

async function onBurst(p, d) {
  const ports = p.rs.map(f => +f[5]), lo = Math.min(...ports), hi = Math.max(...ports), w = Math.max(1024, 2 * (hi - lo))
  const near = () => rnd(Math.max(1024, lo - w), Math.min(65536, hi + w))
  if (p.ok) return
  if (d.b != p.round) {
    if (easy(p)) return // a reply to an earlier round
    p.round = d.b; clearInterval(p.again); p.bs.forEach(o => o.close()); p.bs = []; p.bc = [] // the easy side started a new round
  }
  if (d.c) return p.bc.push(d.c), p.bs.forEach(pc => pc.addIceCandidate(d.c).catch(() => {}))
  if (d.sdp.type == 'answer') { // easy side: start probing
    for (const pc of p.bs) {
      await pc.setRemoteDescription(d.sdp)
      spray(pc, p.rs.at(-1)[4], Array.from({length: M}, (_, k) => k % 2 ? near() : rnd(1024, 65536)))
    }
    return
  }
  // hard side: open K mappings, all answering the same offer with the same credentials
  status(p, 'trying many ports')
  const {cert, munge} = await shared(), b = d.b
  const open = async n => {
    for (let i = 0; i < n && p.round == b && !p.ok; i++) {
      const pc = mkpc(p, {certificates: [cert]})
      pc.born = Date.now(); p.bs.push(pc)
      await pc.setRemoteDescription(d.sdp)
      pc.getTransceivers().forEach(t => t.direction = 'sendrecv')
      setTracks(pc)
      await pc.setLocalDescription(munge(await pc.createAnswer()))
      p.bc.forEach(c => pc.addIceCandidate(c).catch(() => {}))
    }
  }
  await open(FF ? 16 : K)
  sig(p.id, {sdp: p.bs[0].localDescription, b})
  // Firefox gives up on a connection's checks after ~10s and then only answers probes, without the check back
  // that ICE needs, and re-adding the same candidates doesn't restart it. So keep a rolling pool: 16 new
  // connections a second, each closed after 12s. Its STUN rate cap (~78/s per page, each check sent ~5 times)
  // allows ~15 new mappings a second anyway, so ~150-190 are always fresh.
  if (!FF) return
  let busy
  const roll = p.again = setInterval(async () => {
    if (p.round != b || p.ok) return clearInterval(roll)
    if (busy) return
    busy = true
    p.bs = p.bs.filter(pc => Date.now() - pc.born < 12000 || /conn|compl/.test(pc.iceConnectionState) || pc.close()) // not one mid-handshake
    await open(16).catch(console.warn)
    busy = false
  }, 1000)
}

function onSignal(from, d) {
  let p = peers[from]
  if (d.m) return p && onData(p, d.m) // relayed chat
  if (d.r) return p && (p.chain = p.chain.then(() => onTurn(p, d)).catch(console.warn))
  if (d.b) return p && (p.chain = p.chain.then(() => onBurst(p, d)).catch(console.warn))
  if (d.sdp?.type == 'offer' && p) { drop(from); p = null } // they're reconnecting after a network change
  if (!p) { if (d.sdp?.type != 'offer') return; p = connect(from, false) }
  p.chain = p.chain.then(async () => {
    if (d.sdp) {
      await p.pc.setRemoteDescription(d.sdp)
      if (d.sdp.type == 'offer') {
        p.pc.getTransceivers().forEach(t => t.direction = 'sendrecv')
        setTracks(p.pc)
        await p.pc.setLocalDescription()
        sig(from, {sdp: p.pc.localDescription})
      }
    } else if (d.c) {
      await p.pc.addIceCandidate(d.c)
      const f = srflx(d.c)
      if (f) { p.rs.push(f); spray(p.pc, f[4], [1, 2, 3, 4, 5, 6, 7, 8].map(k => +f[5] + k)) } // stage 1: cheap guess
    }
  }).catch(console.warn)
}

function drop(id) {
  const p = peers[id]
  if (!p) return
  delete peers[id]
  ;[p.pc, ...p.bs, p.tr].forEach(o => o?.close()); p.d.remove()
  update()
}

function onData(p, m) {
  if (m.t == 'name') { p.name = String(m.name).slice(0, 30); label(p) }
  if (m.t == 'v') p.d.classList.toggle('novid', !m.on)
  if ((m.t == 'chat' || m.t == 'hist') && typeof m.id == 'string' && !seen.has(m.id)) {
    // live messages are named after the peer that sent them; replayed history has to trust the replayer
    const name = m.t == 'chat' ? p.name : String(m.name).slice(0, 30)
    remember({t: 'chat', id: m.id, name, text: String(m.text).slice(0, 2000), ts: m.ts}); log(name, m.text)
  }
}

const label = p => p.s.textContent = p.name
const toPeer = (p, m) => { const dc = [p.pc.dc, p.tr?.dc].find(c => c?.readyState == 'open'); dc ? dc.send(JSON.stringify(m)) : p.relay && sig(p.id, {m}) }
const bcast = m => Object.values(peers).forEach(p => toPeer(p, m))
const greet = p => { toPeer(p, {t: 'name', name: myName()}); chats.forEach(m => toPeer(p, {...m, t: 'hist'})) }
const myName = () => $('name').value.trim() || 'Guest'
const remember = m => { seen.add(m.id); chats.push(m); if (chats.length > 50) chats.shift() }

function log(who, text) {
  const div = document.createElement('div'), b = document.createElement('b')
  b.textContent = who + ': '; div.append(b, String(text).slice(0, 2000))
  $('log').append(div); $('log').scrollTop = 1e9
  if ($('chat').hidden && who != 'You') toast(who + ': ' + text)
}

// Decide whether we send video: always in small rooms, only while talking in big ones.
function update() {
  const big = Object.keys(peers).length + 1 > BIG
  const want = camOn && (!big || talking) ? local.getVideoTracks()[0] : null
  if (want == sentVideo) return
  sentVideo = want
  Object.values(peers).forEach(p => [p.pc, p.tr].forEach(pc => pc?.getTransceivers()[1]?.sender.replaceTrack(want).catch(() => {})))
  bcast({t: 'v', on: !!want})
}

// ponytail: each client decides alone, no global cap on simultaneous video senders;
// add "max N senders, newest speaker wins" if crosstalk saturates links.
function watchVoice() {
  const an = ac.createAnalyser(), buf = new Float32Array(an.fftSize), hist = []
  ac.createMediaStreamSource(local).connect(an)
  let lastLoud = 0
  setInterval(() => {
    an.getFloatTimeDomainData(buf)
    const rms = Math.sqrt(buf.reduce((s, x) => s + x * x, 0) / buf.length)
    const loud = micOn && rms > 0.02 // tune if mics are very quiet/noisy
    hist.push(loud); if (hist.length > 20) hist.shift() // 2s window
    if (loud) lastLoud = Date.now()
    if (hist.filter(Boolean).length > 10) talking = true
    else if (Date.now() - lastLoud > 5000) talking = false
    update()
  }, 100)
}

$('mic').onclick = () => {
  micOn = !micOn
  local.getAudioTracks().forEach(t => t.enabled = micOn)
  $('mic').classList.toggle('off', !micOn)
}

$('cam').onclick = async () => {
  if ($('cam').disabled) return
  $('cam').disabled = true
  try { await toggleCam() } finally { $('cam').disabled = false }
}

async function toggleCam() {
  if (camOn) { // stop the track so the camera light goes off
    local.getVideoTracks().forEach(t => { t.stop(); local.removeTrack(t) })
  } else {
    try { local.addTrack((await navigator.mediaDevices.getUserMedia({video: true})).getVideoTracks()[0]) }
    catch { return toast('Camera unavailable') }
  }
  camOn = !camOn
  $('cam').classList.toggle('off', !camOn)
  mine.d.classList.toggle('novid', !camOn)
  update()
}

$('chatBtn').onclick = () => { $('chat').hidden = !$('chat').hidden; $('chat').hidden || $('msg').focus() }
$('say').onsubmit = e => {
  e.preventDefault()
  const text = $('msg').value.trim()
  if (!text) return
  const m = {t: 'chat', id: hex(8), name: myName(), text, ts: Date.now()}
  remember(m); bcast(m); log('You', text); $('msg').value = ''
}

$('share').onclick = async () => {
  if (navigator.share) try { return await navigator.share({title: 'Join my call', url: location.href}) } catch (e) { if (e.name == 'AbortError') return }
  try { await navigator.clipboard.writeText(location.href); toast('Link copied') } catch { toast(location.href, 6000) }
}

$('leave').onclick = () => location.href = '/'
</script>
